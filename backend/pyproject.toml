[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invix-shop-backend"
version = "0.1.0"
description = "Clean Architecture backend for Telegram Shop"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]