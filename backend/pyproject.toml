[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invix-shop-backend"
version = "0.1.0"
description = "Clean Architecture backend for Telegram Shop"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.31,<1",
    "pydantic-settings>=2,<3",
    "alembic>=1.16,<2",
    "minio>=7.2.20,<8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
